<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blender AI Copilot</title>
  <style>
    :root {
      --bg-color: #121316;
      --card-bg: #1a1b20;
      --border-color: #2a2b33;
      --text-main: #f0f1f4;
      --text-muted: #9ba1ad;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --tool-bg: #22242c;
      --input-bg: #16171c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(26, 27, 32, 0.85);
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.2px;
    }

    .brand-icon {
      color: var(--accent);
      font-size: 18px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      background: rgba(16, 185, 129, 0.12);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Conversation Area */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    main::-webkit-scrollbar {
      width: 6px;
    }
    main::-webkit-scrollbar-thumb {
      background: #2f313a;
      border-radius: 3px;
    }

    .welcome-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      margin-top: 10px;
    }

    .welcome-card h2 {
      font-size: 18px;
      margin-bottom: 6px;
      color: #fff;
    }

    .welcome-card p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .msg-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 16px;
      animation: fadeIn 0.2s ease-out;
      user-select: text;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .msg-user {
      border-left: 3px solid var(--accent);
    }

    .msg-ai {
      border-left: 3px solid var(--success);
    }

    .msg-content {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-main);
      white-space: pre-wrap;
    }

    .tool-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--tool-bg);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #333642;
      font-size: 12px;
      font-family: monospace;
      color: #cbd5e1;
      margin: 6px 0;
    }

    /* Input Footer */
    footer {
      padding: 14px 16px;
      border-top: 1px solid var(--border-color);
      background: var(--card-bg);
    }

    .input-container {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.15s ease;
    }

    .input-container:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    textarea {
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: #fff;
      font-size: 14px;
      line-height: 1.4;
      width: 100%;
      height: 48px;
      max-height: 120px;
    }

    textarea::placeholder {
      color: #64748b;
    }

    .input-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hint {
      font-size: 11px;
      color: #64748b;
    }

    .btn-send {
      background: #fff;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.1s, background-color 0.15s;
    }

    .btn-send:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }

    .btn-send:active {
      transform: translateY(0);
    }

    .btn-cancel {
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand">
      <span class="brand-icon">✦</span>
      <span>Blender AI Copilot</span>
    </div>
    <div class="status-badge" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">Bridge Online</span>
    </div>
  </header>

  <!-- Main Conversation Area -->
  <main id="chatBox">
    <div class="welcome-card" id="welcomeCard">
      <h2>Hello, Blender AI!</h2>
      <p>Autonomous AI Grounding Copilot for Blender 5.2.<br>Type a prompt below to inspect the scene, meshes, or materials.</p>
    </div>
  </main>

  <!-- Input Area -->
  <footer>
    <div class="input-container">
      <textarea id="promptInput" placeholder="Describe what you want to inspect or build... (e.g. 'Sahneyi incele')" rows="2" autofocus></textarea>
      <div class="input-actions">
        <span class="hint">Enter to send • Shift+Enter for new line</span>
        <button class="btn-cancel" id="cancelBtn" onclick="cancelTurn()">Stop ■</button>
        <button class="btn-send" id="sendBtn" onclick="submitPrompt()">Send ➔</button>
      </div>
    </div>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || '';
    const chatBox = document.getElementById('chatBox');
    const promptInput = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const statusText = document.getElementById('statusText');
    const welcomeCard = document.getElementById('welcomeCard');

    let isBusy = false;
    let activeAiCard = null;
    let activeAiContent = null;

    // 1. Establish SSE stream connection
    function connectEvents() {
      const eventSource = new EventSource(`/api/events?token=${encodeURIComponent(token)}`);

      eventSource.onopen = () => {
        statusText.innerText = "Bridge Online";
      };

      eventSource.onmessage = (e) => {
        try {
          const payload = JSON.parse(e.data);
          handleServerEvent(payload);
        } catch (err) {
          console.error("Failed to parse event:", err);
        }
      };

      eventSource.onerror = () => {
        statusText.innerText = "Reconnecting...";
      };
    }

    // 2. Handle events arriving from Blender Python
    function handleServerEvent(msg) {
      const { event, data } = msg;

      if (event === 'assistant_text_delta') {
        if (!activeAiCard) createAiMessageCard();
        activeAiContent.textContent += data.delta;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
      else if (event === 'tool_started') {
        if (!activeAiCard) createAiMessageCard();
        const toolEl = document.createElement('div');
        toolEl.className = 'tool-pill';
        toolEl.id = `tool-${data.tool_name}`;
        toolEl.innerHTML = `🔧 <span>${data.tool_name}</span> • <i>Executing...</i>`;
        activeAiCard.appendChild(toolEl);
        chatBox.scrollTop = chatBox.scrollHeight;
      }
      else if (event === 'tool_completed') {
        const toolEl = document.getElementById(`tool-${data.tool_name}`);
        if (toolEl) {
          toolEl.innerHTML = `✓ <b>${data.tool_name}</b>: ${data.summary || 'Completed'}`;
        }
      }
      else if (event === 'turn_completed' || event === 'agent_idle') {
        setBusy(false);
      }
    }

    // 3. Submit Prompt to Blender Python
    async function submitPrompt() {
      const text = promptInput.value.trim();
      if (!text || isBusy) return;

      if (welcomeCard) welcomeCard.style.display = 'none';

      // Render user card
      appendMessage('You', text, 'msg-user');
      promptInput.value = '';
      promptInput.style.height = '48px';
      setBusy(true);

      // Create new container for AI response
      createAiMessageCard();

      try {
        const res = await fetch(`/api/prompt?token=${encodeURIComponent(token)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
        if (!res.ok) {
          activeAiContent.textContent = "Error: Failed to submit prompt to Blender.";
          setBusy(false);
        }
      } catch (err) {
        activeAiContent.textContent = `Connection error: ${err.message}`;
        setBusy(false);
      }
    }

    // 4. Cancel active turn
    async function cancelTurn() {
      try {
        await fetch(`/api/cancel?token=${encodeURIComponent(token)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        if (activeAiContent) {
          activeAiContent.textContent += "\n[Turn Cancelled]";
        }
      } finally {
        setBusy(false);
      }
    }

    function createAiMessageCard() {
      const card = document.createElement('div');
      card.className = 'msg-card msg-ai';
      card.innerHTML = `<div class="msg-header"><span>Blender AI</span></div><div class="msg-content"></div>`;
      chatBox.appendChild(card);
      activeAiCard = card;
      activeAiContent = card.querySelector('.msg-content');
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendMessage(sender, text, extraClass) {
      const card = document.createElement('div');
      card.className = `msg-card ${extraClass}`;
      card.innerHTML = `<div class="msg-header"><span>${sender}</span></div><div class="msg-content">${escapeHtml(text)}</div>`;
      chatBox.appendChild(card);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function setBusy(busy) {
      isBusy = busy;
      if (busy) {
        sendBtn.style.display = 'none';
        cancelBtn.style.display = 'inline-flex';
      } else {
        sendBtn.style.display = 'inline-flex';
        cancelBtn.style.display = 'none';
        activeAiCard = null;
        activeAiContent = null;
        promptInput.focus();
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    // Keyboard handlers
    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitPrompt();
      }
    });

    // Auto-grow textarea
    promptInput.addEventListener('input', () => {
      promptInput.style.height = '48px';
      promptInput.style.height = Math.min(promptInput.scrollHeight, 120) + 'px';
    });

    // Start listening on load
    connectEvents();
  </script>
</body>
</html>
